{% extends "base.html" %}
{% block title %}Report an Item — Campus Findr{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto relative">
    <!-- Decorative orb -->
    <div class="orb orb-1" style="width:200px;height:200px;top:-80px;left:-60px;opacity:0.25"></div>

    <h1 class="text-2xl font-bold text-white mb-1 animate-in">Report an Item</h1>
    <p class="text-gray-400 text-sm mb-6 animate-in delay-1">Fill in the details below to help the campus community.</p>

    <form action="{{ url_for('report') }}" method="POST" enctype="multipart/form-data"
          class="glass rounded-2xl p-6 sm:p-8 space-y-6 animate-in delay-2 relative z-10">

        <!-- Lost / Found Toggle -->
        <fieldset>
            <legend class="text-sm font-semibold text-gray-300 mb-3">What are you reporting?</legend>
            <div class="flex gap-3">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="item_type" value="lost" checked class="peer hidden" id="typeLost">
                    <div class="text-center py-3.5 rounded-xl border-2 border-slate-700
                                peer-checked:border-red-500 peer-checked:bg-red-500/10
                                peer-checked:text-red-400 transition font-semibold text-sm text-gray-400
                                hover:border-slate-600">
                        🔴 I Lost Something
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="item_type" value="found" class="peer hidden" id="typeFound">
                    <div class="text-center py-3.5 rounded-xl border-2 border-slate-700
                                peer-checked:border-green-500 peer-checked:bg-green-500/10
                                peer-checked:text-green-400 transition font-semibold text-sm text-gray-400
                                hover:border-slate-600">
                        🟢 I Found Something
                    </div>
                </label>
            </div>
        </fieldset>

        <!-- Title -->
        <div>
            <label for="title" class="block text-sm font-semibold text-gray-300 mb-1.5">Item Title *</label>
            <input type="text" name="title" id="title" required maxlength="120"
                   placeholder="e.g. Blue Realme Earbuds, Honda Bike Key..."
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500">
        </div>

        <!-- Category -->
        <div>
            <label for="category" class="block text-sm font-semibold text-gray-300 mb-1.5">Category *</label>
            <select name="category" id="category" required
                    class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-300">
                <option value="" disabled selected>Select a category</option>
                {% for val, label in categories %}
                <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Description -->
        <div>
            <label for="description" class="block text-sm font-semibold text-gray-300 mb-1.5">Description *</label>
            <textarea name="description" id="description" required rows="3" maxlength="1000"
                      placeholder="Describe the item — colour, brand, distinguishing marks..."
                      class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500 resize-y"></textarea>
            <p class="text-xs text-gray-500 mt-1 text-right"><span id="charCount">0</span>/1000</p>
        </div>

        <!-- Two-column: Date & Location -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="date_occurred" class="block text-sm font-semibold text-gray-300 mb-1.5">Date Lost/Found *</label>
                <input type="date" name="date_occurred" id="date_occurred" required
                       class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 [color-scheme:dark]">
            </div>
            <div>
                <label for="location" class="block text-sm font-semibold text-gray-300 mb-1.5">Location *</label>
                <input type="text" name="location" id="location" required maxlength="200"
                       placeholder="e.g. Library 2nd Floor"
                       class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500">
            </div>
        </div>

        <!-- Deposit Location (Found only) -->
        <div id="depositField" class="hidden">
            <label for="deposit_location" class="block text-sm font-semibold text-gray-300 mb-1.5">
                Deposit Location
                <span class="font-normal text-gray-500">(where did you leave the item?)</span>
            </label>
            <input type="text" name="deposit_location" id="deposit_location" maxlength="200"
                   placeholder="e.g. Left at Security Gate 2"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500">
        </div>

        <!-- Contact Email -->
        <div>
            <label for="contact_email" class="block text-sm font-semibold text-gray-300 mb-1.5">Your Email *</label>
            <input type="email" name="contact_email" id="contact_email" required maxlength="120"
                   placeholder="yourname@college.edu"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-200 placeholder-gray-500">
        </div>

        <!-- Photo Upload -->
        <div>
            <label class="block text-sm font-semibold text-gray-300 mb-1.5">Photo (optional)</label>
            <div class="upload-area rounded-xl p-6 text-center cursor-pointer"
                 id="uploadArea" onclick="document.getElementById('photoInput').click()">
                <input type="file" name="photo" id="photoInput" accept="image/jpeg,image/png" class="hidden">
                <div id="uploadPlaceholder">
                    <span class="text-3xl block mb-2">📷</span>
                    <p class="text-sm text-gray-400">Click to upload a photo</p>
                    <p class="text-xs text-gray-500 mt-1">JPEG or PNG, max 5 MB</p>
                </div>
                <img id="imagePreview" class="img-preview mx-auto hidden" alt="Preview">
            </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-gradient w-full text-white font-semibold py-3 rounded-xl text-sm">
            <span>Submit Report</span>
        </button>
    </form>
</div>
{% endblock %}
